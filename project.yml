name: Flashback
options:
  bundleIdPrefix: com.yoinklabs
  deploymentTarget:
    iOS: '18.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    exactVersion: '1.7.1'
targets:
  Flashback:
    type: application
    platform: iOS
    sources:
      - path: Flashback
        excludes:
          # StoreKit testing config: used by the scheme and unit tests, never
          # shipped in the app bundle.
          - Resources/Flashback.storekit
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: Clerk
        product: ClerkKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yoinklabs.flashback
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '3'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Flashback/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Flashback
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 'Flashback picks a few random photos or videos for your game. Only small copies of the ones picked are shared with your room, and they are deleted after each round.'
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        DEVELOPMENT_TEAM: 64PUT29XZ8
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Flashback/Resources/Flashback.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      # Local tip products for simulator and Xcode runs. The real consumables
      # (dev.yoinklabs.flashback.tip.*) live in App Store Connect.
      storeKitConfiguration: Flashback/Resources/Flashback.storekit
      testTargets: [FlashbackTests]
  FlashbackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FlashbackTests
      # Bundled so a test can check the config matches the code's product ids.
      - path: Flashback/Resources/Flashback.storekit
        buildPhase: resources
    dependencies:
      - target: Flashback
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.yoinklabs.flashback.tests
